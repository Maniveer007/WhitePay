# Single-node SaaS deployment.
#   web       the website and consoles (Next.js). This is the public entry point: it also forwards /api/*, the checkout pages and
#             widget.js to the API, so one origin serves everything.
#   whitepay  the API, indexer and keeper. Not published: only `web` talks to it.
# Put a TLS-terminating proxy (Caddy, nginx, a cloud load balancer) in front of web, and have it set X-Forwarded-For.
# Copy .env.example to .env and fill it in first. Back up ./data: it holds the database and deployment.json.
services:
  whitepay:
    build: .
    restart: unless-stopped
    expose: ["3000"]
    env_file: .env
    environment:
      SIGNUP_OPEN: "${SIGNUP_OPEN:-0}"
    volumes:
      - ./data:/app/data

  web:
    build:
      context: ./web
      args:
        API_ORIGIN: http://whitepay:3000
    restart: unless-stopped
    depends_on: [whitepay]
    ports: ["3000:3001"]
